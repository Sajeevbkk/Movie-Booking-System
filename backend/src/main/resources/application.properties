spring.application.name=movie-booking-backend
server.port=8080

# Import database and admin credentials from app.properties
spring.config.import=optional:classpath:app.properties,optional:file:app.properties

# Spring Datasource (wired to db.* properties in app.properties)
spring.datasource.url=${db.url}
spring.datasource.username=${db.username}
spring.datasource.password=${db.password}
spring.datasource.driver-class-name=${db.driver}

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Multipart File Upload (support high-resolution posters up to 15MB)
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# Caching Configuration
spring.cache.type=caffeine
spring.cache.caffeine.spec=${cache.caffeine.spec}
spring.cache.cache-names=movies,movie_detail,posters,showtimes,theaters

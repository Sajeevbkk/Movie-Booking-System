<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineMagic Box Office Server</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .hero-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 3rem;
            max-width: 650px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }
        .btn-cinema {
            background: #2563eb;
            color: white;
            font-weight: 600;
            padding: 0.8rem 1.75rem;
            border-radius: 10px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s ease;
        }
        .btn-cinema:hover {
            background: #1d4ed8;
            color: white;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<div class="hero-card">
    <div class="mb-4">
        <i class="bi bi-film text-primary" style="font-size: 3.5rem;"></i>
    </div>
    <h2 class="fw-bold mb-2">CineMagic Box Office</h2>
    <p class="text-light-emphasis mb-4">
        Spring Boot REST API &amp; MySQL Database Server is running successfully.
    </p>

    <div class="d-flex justify-content-center gap-3 mb-4">
        <a href="/admin/login.html" class="btn-cinema">
            <i class="bi bi-shield-lock"></i> Open Admin Dashboard
        </a>
    </div>

    <div class="border-top border-secondary pt-3 text-secondary small">
        Desktop Java Swing Application connects to this server on port <code>8080</code>.
    </div>
</div>

</body>
</html>

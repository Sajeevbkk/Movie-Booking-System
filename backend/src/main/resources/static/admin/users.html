<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineMagic Admin - Registered Users</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar Navigation -->
        <div class="col-md-3 col-lg-2 admin-sidebar p-0">
            <div class="admin-brand">
                <i class="bi bi-film"></i>
                <span>CineMagic Admin</span>
            </div>
            <ul class="sidebar-nav">
                <li class="nav-item">
                    <a href="index.html" class="nav-link" id="navDashboard">
                        <i class="bi bi-speedometer2"></i>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="movies.html" class="nav-link" id="navMovies">
                        <i class="bi bi-camera-reels"></i>
                        <span>Movies & Posters</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="showtimes.html" class="nav-link" id="navShowtimes">
                        <i class="bi bi-calendar-event"></i>
                        <span>Showtimes</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="bookings.html" class="nav-link" id="navBookings">
                        <i class="bi bi-ticket-perforated"></i>
                        <span>Bookings</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="users.html" class="nav-link" id="navUsers">
                        <i class="bi bi-people"></i>
                        <span>Registered Users</span>
                    </a>
                </li>
            </ul>
        </div>

        <!-- Main Content Area -->
        <div class="col-md-9 col-lg-10 admin-content">
            <div class="top-bar">
                <div>
                    <h5 class="fw-bold m-0 text-dark">User Account Management</h5>
                    <p class="text-muted small m-0">Customers and administrative accounts stored in database</p>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <button onclick="loadUsers()" class="btn btn-outline-primary btn-sm">
                        <i class="bi bi-arrow-clockwise me-1"></i> Refresh
                    </button>
                    <button onclick="logout()" class="btn btn-outline-danger btn-sm">
                        <i class="bi bi-box-arrow-right me-1"></i> Logout
                    </button>
                </div>
            </div>

            <!-- Users Table -->
            <div class="card-table">
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead>
                            <tr>
                                <th>User ID</th>
                                <th>Username</th>
                                <th>Full Name</th>
                                <th>Email</th>
                                <th>Phone</th>
                                <th>Role</th>
                                <th>Bookings Placed</th>
                                <th>Registered Date</th>
                                <th class="text-end">Action</th>
                            </tr>
                        </thead>
                        <tbody id="usersTbody">
                            <tr>
                                <td colspan="9" class="text-center py-4 text-muted">
                                    <div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div>
                                    Loading registered users...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="assets/js/admin.js"></script>
<script>
    if (checkAdminAuth()) {
        initAdminNav('navUsers');
        loadUsers();
    }

    async function loadUsers() {
        try {
            const res = await apiFetch('/api/admin/users');
            if (res.ok) {
                const users = await res.json();
                const tbody = document.getElementById('usersTbody');
                if (!users || users.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="9" class="text-center py-4 text-muted">No users found.</td></tr>';
                    return;
                }

                const currentAdminStr = localStorage.getItem('admin_user');
                let currentAdminUsername = '';
                if (currentAdminStr) {
                    try { currentAdminUsername = JSON.parse(currentAdminStr).username; } catch(e){}
                }

                tbody.innerHTML = users.map(u => {
                    const isSelf = currentAdminUsername && u.username.toLowerCase() === currentAdminUsername.toLowerCase();
                    const roleBadge = u.role === 'ROLE_ADMIN'
                        ? '<span class="badge bg-danger-subtle text-danger border">Admin</span>'
                        : '<span class="badge bg-primary-subtle text-primary border">Customer</span>';
                    const registeredDate = u.createdAt ? new Date(u.createdAt).toLocaleDateString() : '-';

                    const actionHtml = isSelf
                        ? '<span class="badge bg-light text-muted border">Current Admin</span>'
                        : `<button class="btn btn-sm btn-outline-danger" onclick="removeUser(${u.id}, '${u.username}')">
                             <i class="bi bi-person-x me-1"></i>Remove
                           </button>`;

                    return `
                        <tr>
                            <td>#${u.id}</td>
                            <td class="fw-bold">${u.username}</td>
                            <td>${u.fullName || '-'}</td>
                            <td>${u.email}</td>
                            <td>${u.phone || '-'}</td>
                            <td>${roleBadge}</td>
                            <td><span class="badge bg-light text-dark border">${u.bookingCount} bookings</span></td>
                            <td class="small text-muted">${registeredDate}</td>
                            <td class="text-end">${actionHtml}</td>
                        </tr>
                    `;
                }).join('');
            }
        } catch (e) {
            console.error('Error loading users', e);
        }
    }

    async function removeUser(id, username) {
        if (!confirm(`Are you sure you want to remove user "${username}"?\nThis will permanently delete the user and any associated booking records.`)) {
            return;
        }

        try {
            const res = await apiFetch(`/api/admin/users/${id}`, { method: 'DELETE' });
            const data = await res.json();
            if (res.ok) {
                loadUsers();
            } else {
                alert('Error: ' + (data.error || 'Failed to remove user'));
            }
        } catch (err) {
            alert('Error removing user: ' + err.message);
        }
    }
</script>
</body>
</html>

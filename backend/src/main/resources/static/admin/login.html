<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineMagic Admin - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/css/admin.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 420px;
            padding: 2.5rem;
        }
        .login-logo {
            width: 56px;
            height: 56px;
            background: #2563eb;
            color: #ffffff;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.75rem;
            margin: 0 auto 1.25rem auto;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="text-center">
        <div class="login-logo">
            <i class="bi bi-film"></i>
        </div>
        <h4 class="fw-bold mb-1">CineMagic Box Office</h4>
        <p class="text-muted small mb-4">Administrator Management Portal</p>
    </div>

    <div id="alertBox" class="alert alert-danger d-none small py-2" role="alert"></div>

    <form id="loginForm">
        <div class="mb-3">
            <label class="form-label small fw-semibold">Username</label>
            <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                <input type="text" id="username" class="form-control" placeholder="admin" required autofocus>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label small fw-semibold">Password</label>
            <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required>
            </div>
            <div class="form-text small">Default credentials configured in <code>app.properties</code></div>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm">
            <span id="btnText">Sign In as Admin</span>
            <span id="btnSpinner" class="spinner-border spinner-border-sm d-none ms-1" role="status"></span>
        </button>
    </form>
</div>

<script src="assets/js/admin.js"></script>
<script>
    // Redirect if already logged in as admin
    const token = getAdminToken();
    if (token) {
        window.location.href = 'index.html';
    }

    const form = document.getElementById('loginForm');
    const alertBox = document.getElementById('alertBox');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.classList.add('d-none');
        btnText.textContent = 'Authenticating...';
        btnSpinner.classList.remove('d-none');
        submitBtn.disabled = true;

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const data = await res.json();
            if (!res.ok) {
                throw new Error(data.error || 'Authentication failed');
            }

            if (data.role !== 'ROLE_ADMIN') {
                throw new Error('Access denied: Admin role required to access this portal');
            }

            localStorage.setItem('admin_token', data.token);
            localStorage.setItem('admin_user', JSON.stringify(data));
            window.location.href = 'index.html';
        } catch (err) {
            alertBox.textContent = err.message;
            alertBox.classList.remove('d-none');
        } finally {
            btnText.textContent = 'Sign In as Admin';
            btnSpinner.classList.add('d-none');
            submitBtn.disabled = false;
        }
    });
</script>
</body>
</html>
